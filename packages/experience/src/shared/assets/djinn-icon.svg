<!-- Марка «Готовченко» в квадратном поле: пути 1:1 из public/brand/mark.svg, без фильтров
     (на 16px внутренняя тень даёт грязь). Боковых полей нет: viewBox по ширине ровно равен
     ширине марки (465), квадрат добирается только по вертикали. В боксе вкладки 16px это
     даёт марке все 16px ширины вместо 14.4 — на таком размере каждый пиксель решает, а
     пустота сверху и снизу дешевле, чем уменьшение самой марки. Фон прозрачный:
     среднетоновые цвета читаются и на светлой, и на тёмной панели вкладок. -->
