name: Publish Djinn Logto Experience

on:
  push:
    branches:
      - djinn/v1.41.0-experience
  workflow_dispatch:

concurrency:
  group: publish-djinn-experience-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

env:
  IMAGE_NAME: ghcr.io/gotovchenkoai/logto

jobs:
  publish:
    runs-on: ubuntu-latest
    outputs:
      image: ${{ fromJSON(steps.meta.outputs.json).tags[0] }}
      digest: ${{ steps.build.outputs.digest }}

    steps:
      - name: Check out exact revision
        uses: actions/checkout@v4

      - name: Derive image tags and labels
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=sha,format=long,prefix=sha-
            type=raw,value=latest

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish amd64 image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}

      - name: Report published artifact
        shell: bash
        env:
          IMAGE_TAGS: ${{ steps.meta.outputs.tags }}
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          {
            echo "### Published Djinn Logto Experience"
            echo
            echo "- Tags:"
            while IFS= read -r tag; do
              [[ -n "${tag}" ]] && echo "  - \`${tag}\`"
            done <<< "${IMAGE_TAGS}"
            echo "- Digest: \`${IMAGE_DIGEST}\`"
            echo "- Deploy reference: \`${IMAGE_NAME}@${IMAGE_DIGEST}\`"
          } >> "$GITHUB_STEP_SUMMARY"
